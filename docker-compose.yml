services:
  postgres:
    image: postgres:16-alpine
    container_name: volunteer-smart-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-volunteer}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-volunteer_secret}
      - POSTGRES_DB=${POSTGRES_DB:-volunteer_smart}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volunteer} -d ${POSTGRES_DB:-volunteer_smart}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-unknown}
    container_name: volunteer-smart-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-volunteer}:${POSTGRES_PASSWORD:-volunteer_secret}@postgres:5432/${POSTGRES_DB:-volunteer_smart}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SWAGGER_USER=${SWAGGER_USER}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD}
      - IAM_GOV_API_URL=https://api-auth.govcenter.co
      - E_SERVICE_API_KEY=${E_SERVICE_API_KEY}
      - E_SERVICE_CODE=${E_SERVICE_CODE}
    env_file:
      - .env
    volumes:
      - bg-uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
        - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
        - NEXT_PUBLIC_MAPBOX_STYLE=${NEXT_PUBLIC_MAPBOX_STYLE}
    container_name: volunteer-smart-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
      - NEXT_PUBLIC_MAPBOX_STYLE=${NEXT_PUBLIC_MAPBOX_STYLE}
      - GOV_API_URL=https://api-volunteer-eservice.govcenter.co/
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    external: true

volumes:
  postgres-data:
  bg-uploads:
